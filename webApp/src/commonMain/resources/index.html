<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
        <link rel="manifest" href="./manifest.json">
        <title>Pixelix</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
        </circle>
    </svg>
    </body>

    <script>
        (() => {
            const calls = window.webglInvalidationCalls = {
                invalidateFramebuffer: 0,
                invalidateSubFramebuffer: 0,
                discardFramebufferEXT: 0
            };

            // WebGL 2
            const gl2 = window.WebGL2RenderingContext?.prototype;
            for (const name of [
                "invalidateFramebuffer",
                "invalidateSubFramebuffer"
            ]) {
                if (gl2 && typeof gl2[name] === "function") {
                    gl2[name] = function () {
                        calls[name]++;
                    };
                }
            }

            // WebGL 1: перехватываем получение объекта расширения.
            const patched = new WeakSet();

            for (const Context of [
                window.WebGLRenderingContext,
                window.WebGL2RenderingContext
            ]) {
                if (!Context) continue;

                const proto = Context.prototype;
                const original = proto.getExtension;

                proto.getExtension = function (...args) {
                    const extension = original.apply(this, args);

                    if (extension &&
                        typeof extension.discardFramebufferEXT === "function" &&
                        !patched.has(extension)) {
                        extension.discardFramebufferEXT = function () {
                            calls.discardFramebufferEXT++;
                        };
                        patched.add(extension);
                    }

                    return extension;
                };
            }

            console.info("WebGL invalidation disabled", calls);
        })();
    </script>
    <script src="webApp.js"></script>
</html>
