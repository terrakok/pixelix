<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Signing in…</title>
    </head>
    <body>
        <p>Return to Pixelix to finish signing in. You can close this window.</p>
        <script>
            // Persist before closing: the app tab may be suspended and window.opener
            // may have been severed by the OAuth provider's isolation policy.
            try {
                window.localStorage.setItem('pixelix-oauth-redirect', window.location.href);
                window.close();
            } catch (error) {
                document.querySelector('p').textContent =
                    'Could not finish sign in. Allow browser storage and try again.';
            }
        </script>
    </body>
</html>
